name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (TypeScript)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skills_ci_only
          POSTGRES_DB: skills_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SKILLS_TEST_PG_URL: postgres://postgres:skills_ci_only@localhost:55432/skills_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test release PR automation
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: npx prettier --check "api/src/**/*.ts" "cli/src/**/*.ts" "telegram/src/**/*.ts"

      - name: Lint
        run: yarn lint

      - name: Build all workspaces
        run: yarn build

      - name: Typecheck CLI tests
        run: yarn workspace omnikey-cli run test:types

      - name: Run tests
        run: yarn test

  macos:
    name: Build and test (macOS app)
    # macos-14 ships Swift 5.10, which cannot even parse swift-tools-version:6.0.
    # macos-15 ships Swift 6.0, which rejects actor-isolation patterns that later
    # 6.x compilers accept. macos-26 tracks the current toolchain the app is
    # developed against.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build
        working-directory: ./macOS

      - name: Test
        run: swift test
        working-directory: ./macOS

  windows:
    name: Build and test (Windows app)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --nologo
        working-directory: ./windows

      - name: Test Windows Skills contracts and state
        run: dotnet test windows.Tests/OmniKey.Windows.Tests.csproj --nologo
