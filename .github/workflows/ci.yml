name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (TypeScript)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skills_ci_only
          POSTGRES_DB: skills_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SKILLS_TEST_PG_URL: postgres://postgres:skills_ci_only@localhost:55432/skills_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test release PR automation
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Setup pnpm (version pinned in package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build all workspaces
        run: pnpm build

      - name: Typecheck CLI tests
        run: pnpm test:types

      - name: Verify workspace and packaging contracts
        run: pnpm test:tooling

      - name: Verify Turbo ordering, cache restoration and invalidation
        run: pnpm test:cache

      - name: Verify standalone CLI bundle
        run: |
          pnpm --filter omnikey-cli deploy --prod "$RUNNER_TEMP/omnikey-cli"
          node scripts/verify-cli-bundle.mjs "$RUNNER_TEMP/omnikey-cli"

      - name: Verify npm package outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/omnikey-pack" "$RUNNER_TEMP/omnikey-consumer"
          npm pack ./cli --pack-destination "$RUNNER_TEMP/omnikey-pack"
          npm install --prefix "$RUNNER_TEMP/omnikey-consumer" --no-save --package-lock=false "$RUNNER_TEMP"/omnikey-pack/*.tgz
          node scripts/verify-cli-bundle.mjs "$RUNNER_TEMP/omnikey-consumer/node_modules/omnikey-cli" "$RUNNER_TEMP/omnikey-consumer"

      - name: Smoke-test production Docker image
        run: |
          docker build -t omnikey-ci .
          trap 'docker rm -f omnikey-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name omnikey-ci-smoke -e OPENAI_API_KEY=sk-test-dummy -e IS_SELF_HOSTED=true -e SQLITE_PATH=/tmp/omnikey-test.sqlite omnikey-ci
          for attempt in $(seq 1 30); do
            if docker exec omnikey-ci-smoke node -e 'require("./api/node_modules/sqlite3"); fetch("http://localhost:8080/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
              exit 0
            fi
            sleep 2
          done
          docker logs omnikey-ci-smoke
          exit 1

      - name: Run tests
        run: pnpm test

  macos:
    name: Build and test (macOS app)
    # macos-14 ships Swift 5.10, which cannot even parse swift-tools-version:6.0.
    # macos-15 ships Swift 6.0, which rejects actor-isolation patterns that later
    # 6.x compilers accept. macos-26 tracks the current toolchain the app is
    # developed against.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build
        working-directory: ./macOS

      - name: Test
        run: swift test
        working-directory: ./macOS

  windows:
    name: Build and test (Windows app)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --nologo
        working-directory: ./windows

      - name: Test Windows Skills contracts and state
        run: dotnet test windows.Tests/OmniKey.Windows.Tests.csproj --nologo
