name: Release Omnikey CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to release or retry'
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.arch }} tarball
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            npm_arch: arm64
          - os: macos-15-intel
            arch: x86_64
            npm_arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Get version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          echo "TAG=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install monorepo dependencies
        run: yarn install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.npm_arch }}

      - name: Build all workspaces (api, telegram, cli)
        run: yarn build
        env:
          npm_config_arch: ${{ matrix.npm_arch }}

      - name: Stage self-contained CLI bundle
        run: |
          STAGE="$RUNNER_TEMP/omnikey-cli-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # Copy build artifacts and metadata. node_modules is intentionally omitted —
          # we re-resolve production-only dependencies inside the staging directory below.
          cp -R cli/dist "$STAGE/dist"
          cp -R cli/backend-dist "$STAGE/backend-dist"
          cp -R cli/telegram-client-dist "$STAGE/telegram-client-dist"
          cp cli/package.json "$STAGE/package.json"
          cp cli/README.md "$STAGE/README.md"
          # Install production dependencies in the staging dir, isolated from the
          # monorepo's workspaces so `node_modules` is fully resolved under cli/.
          cd "$STAGE"
          yarn install --production --no-lockfile
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Verify staged CLI and native dependencies
        env:
          EXPECTED_ARCH: ${{ matrix.npm_arch }}
        run: |
          cd "$STAGE"
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected runner architecture: " + process.arch); require("sqlite3");'
          node dist/index.js --version

      - name: Create release tarball
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TARBALL="omnikey-cli-${VERSION}-darwin-${{ matrix.arch }}.tar.gz"
          tar -czf "$TARBALL" \
            -C "$STAGE" \
            dist/ \
            backend-dist/ \
            telegram-client-dist/ \
            node_modules/ \
            package.json \
            README.md
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-darwin-${{ matrix.arch }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  release:
    name: Create GitHub Release and propose formula updates
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          # The changelog generator walks every tag, so a shallow clone is not enough.
          fetch-depth: 0

      - name: Get version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          echo "TAG=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download arm64 tarball
        uses: actions/download-artifact@v4
        with:
          name: tarball-darwin-arm64
          path: ./release-assets

      - name: Download x86_64 tarball
        uses: actions/download-artifact@v4
        with:
          name: tarball-darwin-x86_64
          path: ./release-assets

      - name: Compute SHA256 checksums
        id: sha256
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          ARM64_FILE="release-assets/omnikey-cli-${VERSION}-darwin-arm64.tar.gz"
          X86_FILE="release-assets/omnikey-cli-${VERSION}-darwin-x86_64.tar.gz"
          ARM64_SHA=$(sha256sum "$ARM64_FILE" | awk '{print $1}')
          X86_SHA=$(sha256sum "$X86_FILE" | awk '{print $1}')
          echo "ARM64_SHA=$ARM64_SHA" >> "$GITHUB_OUTPUT"
          echo "X86_SHA=$X86_SHA" >> "$GITHUB_OUTPUT"
          echo "ARM64: $ARM64_SHA"
          echo "x86_64: $X86_SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
          generate_release_notes: true
          tag_name: ${{ steps.version.outputs.TAG }}

      - name: Update Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ARM64_SHA: ${{ steps.sha256.outputs.ARM64_SHA }}
          X86_SHA: ${{ steps.sha256.outputs.X86_SHA }}
        run: |
          sed -i \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            -e "/darwin-arm64/,/sha256 \"/{s/sha256 \"[^\"]*\"/sha256 \"${ARM64_SHA}\"/}" \
            -e "/darwin-x86_64/,/sha256 \"/{s/sha256 \"[^\"]*\"/sha256 \"${X86_SHA}\"/}" \
            Formula/omnikey-cli.rb

      - name: Open pull request for formula and generated pages
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BRANCH="automation/release-v${VERSION}"
          git check-ref-format --branch "$BRANCH"
          UPDATED_FORMULA="$(mktemp)"
          cp Formula/omnikey-cli.rb "$UPDATED_FORMULA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -- Formula/omnikey-cli.rb
          git checkout -B "$BRANCH" origin/main
          cp "$UPDATED_FORMULA" Formula/omnikey-cli.rb

          # Regenerate the public changelog from the tag history now that the
          # new tag exists. Starts from main so the generated page matches the nav
          # and footer currently shipped in docs.html.
          python3 scripts/generate-changelog.py
          python3 scripts/generate-blog.py

          git add Formula/omnikey-cli.rb api/public/changelog.html api/public/changelog.xml \
            api/public/blog.html api/public/blog/
          if git diff --cached --quiet; then
            echo "Formula and changelog are already up to date on main."
          else
            git commit -m "chore: update Homebrew formula and generated pages to v${VERSION}"
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || \
              test -z "$(git ls-remote --heads origin "$BRANCH")"
            git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
            PR_URL=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
            if [ -z "$PR_URL" ]; then
              gh pr create --base main --head "$BRANCH" \
                --title "chore: update release metadata for v${VERSION}" \
                --body "Updates the Homebrew formula and generated changelog/blog pages for v${VERSION}. Generated by the release workflow; review and merge manually."
            else
              echo "Updated existing pull request: $PR_URL"
            fi
          fi

      - name: Open pull request in homebrew-omnikey tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
          GH_REPO: GurinderRawala/homebrew-omnikey
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_PAT is not configured."
            exit 1
          fi

          BRANCH="automation/release-v${VERSION}"
          git check-ref-format --branch "$BRANCH"
          gh auth setup-git
          git clone --branch main https://github.com/GurinderRawala/homebrew-omnikey.git tap-repo
          cp Formula/omnikey-cli.rb tap-repo/omnikey-cli.rb
          cd tap-repo
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add omnikey-cli.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap formula is already up to date."
          else
            git commit -m "chore: update Homebrew formula to v${VERSION}"
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || \
              test -z "$(git ls-remote --heads origin "$BRANCH")"
            git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
            PR_URL=$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
            if [ -z "$PR_URL" ]; then
              gh pr create --base main --head "$BRANCH" \
                --title "chore: update Homebrew formula to v${VERSION}" \
                --body "Updates the Homebrew formula for OmniKey CLI v${VERSION}. Generated by the release workflow; review and merge manually."
            else
              echo "Updated existing pull request: $PR_URL"
            fi
          fi
