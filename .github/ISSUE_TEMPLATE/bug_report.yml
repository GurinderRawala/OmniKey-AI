name: Bug report
description: Something in OmniKey is not working as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact any API keys before pasting logs.
  - type: input
    id: version
    attributes:
      label: OmniKey version
      description: Output of `omnikey --version`.
      placeholder: '1.8.10'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Configured LLM provider
      options:
        - OpenAI
        - Anthropic
        - Google Gemini
        - OpenAI-compatible / self-hosted
        - Not relevant to this bug
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - CLI (omnikey ...)
        - Daemon / API
        - macOS menu bar app
        - Windows tray app
        - OmniAgent task
        - Telegram bridge
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select text in ...
        2. Press ⌘E
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: '`omnikey logs` — redact API keys first. Rendered as a code block.'
      render: shell
