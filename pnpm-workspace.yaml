packages:
  - api
  - cli
  - telegram

# Only audited native/build tools may execute dependency lifecycle scripts.
onlyBuiltDependencies:
  - sqlite3

# protobufjs only prints version-range advice; no generated runtime artifacts.
ignoredBuiltDependencies:
  - protobufjs

# pnpm's lockfile-based deploy creates a portable, isolated production graph.
injectWorkspacePackages: true
